<div class="base-data-table-container">
  <!-- Toolbar -->
  <div class="table-toolbar">
    <div class="toolbar-left">
      <ng-container *ngIf="showColumnManagement">
        <button pButton type="button" icon="pi pi-cog" label="Manage Columns" (click)="openColumnManager()"></button>
      </ng-container>
      <button
        pButton
        type="button"
        icon="pi pi-times-circle"
        label="Clear Filters"
        (click)="clearFilters()"
        [disabled]="getFilterCount() === 0"
      ></button>
      <ng-container *ngIf="showColumnManagement">
        <button pButton type="button" icon="pi pi-refresh" label="Reset Columns" (click)="resetColumns()"></button>
      </ng-container><!-- Add these two buttons only when expandable is true -->
      <ng-container *ngIf="expandable">
        <button pButton type="button" icon="pi pi-angle-down" label="Expand All" (click)="onExpandAll()"></button>
        <button pButton type="button" icon="pi pi-angle-up" label="Collapse All" (click)="onCollapseAll()"></button>
      </ng-container>
    </div>
    <div class="toolbar-right">
      <span class="result-count" *ngIf="!isLoading">
        {{ totalCount || 0 }} {{ (totalCount || 0) === 1 ? "result" : "results" }}
      </span>
    </div>
  </div>

  <!-- Table -->
  <nz-table
    #basicTable
    [nzData]="tableData"
    [nzLoading]="isLoading"
    [nzTotal]="totalCount || 0"
    [nzPageSize]="pageSize"
    [nzPageIndex]="currentPage"
    [nzFrontPagination]="false"
    [nzShowSizeChanger]="true"
    [nzPageSizeOptions]="[5, 10, 25, 50, 100]"
    (nzPageIndexChange)="onPageChange($event)"
    (nzPageSizeChange)="onPageSizeChange($event)"
    nzSize="small"
    [nzScroll]="{ x: 'max-content', y: maxTableHeight }"
  >
    <thead>
      <tr
        cdkDropList
        cdkDropListOrientation="horizontal"
        (cdkDropListDropped)="onColumnDrop($event)"
      >
        <!-- Expansion column -->
        <th *ngIf="expandable" nzWidth="50px"></th>

        <!-- Data columns -->
        <th
          *ngFor="let column of getVisibleColumns(); trackBy: trackByKey"
          [nzWidth]="column.width || null"
          [nzAlign]="column.align || 'left'"
          [nzSortFn]="column.sortable ? true : null"
          (nzSortOrderChange)="onSort(column.key)"
          cdkDrag
          [cdkDragData]="column"
          (cdkDragStarted)="onColumnDragStart($event)"
          (mousedown)="onHeaderMouseDown($event)"
          class="draggable-header"
        >
          <div class="header-content">
            <span class="column-label">{{ column.label }}</span>
            <i class="pi pi-arrows-alt drag-handle"></i>
          </div>
        </th>
      </tr>

      <!-- Filter row -->
      <tr class="filter-row">
        <!-- Expansion column spacer -->
        <th *ngIf="expandable"></th>

        <!-- Filter inputs -->
        <th *ngFor="let column of getVisibleColumns(); trackBy: trackByKey">
          <ng-container *ngIf="column.filterable">
            <!-- Text filter -->
            <input
              *ngIf="!column.filterType || column.filterType === 'text'"
              type="text"
              pInputText
              placeholder="Filter {{ column.label }}"
              [value]="filters[column.key] || ''"
              (input)="onFilterChange(column.key, $any($event.target).value)"
              class="filter-input"
            />

            <!-- Number filter -->
            <p-inputNumber
              *ngIf="column.filterType === 'number'"
              [placeholder]="'Filter ' + column.label"
              [(ngModel)]="filters[column.key]"
              (ngModelChange)="onFilterChange(column.key, $event)"
              class="filter-input"
            >
            </p-inputNumber>

            <!-- Select filter -->
            <p-dropdown
              *ngIf="column.filterType === 'select'"
              [showClear]="true"
              [placeholder]="'Filter ' + column.label"
              [(ngModel)]="filters[column.key]"
              (ngModelChange)="onFilterChange(column.key, $event)"
              [options]="column.filterOptions"
              optionLabel="label"
              optionValue="value"
              class="filter-input"
            ></p-dropdown>

            <!-- Number Range filter with two inputs -->
            <div *ngIf="column.filterType === 'number-range'" class="range-filter-container">
              <p-inputNumber
                [min]="column.rangeConfig?.min || 0"
                [max]="column.rangeConfig?.max || 100"
                [step]="column.rangeConfig?.step || 1"
                placeholder="Min"
                [(ngModel)]="filters[column.key + 'Min']"
                (ngModelChange)="onRangeMinChange(column.key, $event, column.rangeConfig)"
                [prefix]="column.key === 'estimated_value' ? '$' : ''"
                [useGrouping]="true"
                class="range-input range-input-min"
              >
              </p-inputNumber>
              <span class="range-separator">-</span>
              <p-inputNumber
                [min]="column.rangeConfig?.min || 0"
                [max]="column.rangeConfig?.max || 100"
                [step]="column.rangeConfig?.step || 1"
                placeholder="Max"
                [(ngModel)]="filters[column.key + 'Max']"
                (ngModelChange)="onRangeMaxChange(column.key, $event, column.rangeConfig)"
                [prefix]="column.key === 'estimated_value' ? '$' : ''"
                [useGrouping]="true"
                class="range-input range-input-max"
              >
              </p-inputNumber>
            </div>
          </ng-container>
        </th>
      </tr>
    </thead>

    <tbody>
      <ng-container *ngFor="let row of basicTable.data; trackBy: trackByIndex">
        <!-- Main row -->
        <tr>
          <!-- Expansion toggle -->
          <td *ngIf="expandable">
            <button
              pButton
              type="button"
              class="p-button-text p-button-sm"
              (click)="toggleRowExpansion(row)"
            >
              <i [class]="isRowExpanded(row) ? 'pi pi-angle-down' : 'pi pi-angle-right'"></i>
            </button>
          </td>

          <!-- Data cells -->
          <td
            *ngFor="let column of getVisibleColumns(); trackBy: trackByKey"
            [nzAlign]="column.align || 'left'"
          >
            <!-- Use custom template if provided -->
            <ng-container *ngIf="cellTemplate">
              <ng-container
                *ngTemplateOutlet="
                  cellTemplate;
                  context: { column: column, row: row }
                "
              >
              </ng-container>
            </ng-container>

            <!-- Default cell rendering -->
            <ng-container *ngIf="!cellTemplate">
              {{
                column.formatter
                  ? column.formatter($any(row)[column.key], row)
                  : $any(row)[column.key]
              }}
            </ng-container>
          </td>
        </tr>

        <!-- Expansion row -->
        <tr *ngIf="expandable && isRowExpanded(row)" class="expansion-row">
          <td [attr.colspan]="getVisibleColumns().length + 1">
            <div class="expansion-content">
              <ng-container *ngIf="expansionTemplate">
                <ng-container
                  *ngTemplateOutlet="expansionTemplate; context: { row: row }"
                >
                </ng-container>
              </ng-container>
            </div>
          </td>
        </tr>
      </ng-container>
    </tbody>
  </nz-table>

  <!-- Empty state -->
  <nz-empty
    *ngIf="!isLoading && tableData.length === 0"
    nzNotFoundContent="No data available"
  >
  </nz-empty>
</div>

<!-- Column Manager Drawer -->
<app-column-manager
  [(visible)]="columnManagerVisible"
  [columns]="columns"
  (columnsChange)="savePreferences()"
>
</app-column-manager>
