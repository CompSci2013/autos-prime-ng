<nz-drawer
  [nzVisible]="visible"
  [nzWidth]="700"
  nzTitle="Manage Columns"
  nzPlacement="right"
  [nzFooter]="footerTemplate"
  (nzOnClose)="onClose()"
>
  <!-- Drawer Content -->
  <ng-container *nzDrawerContent>
    <div class="column-manager-container">
      <!-- Info Section -->
      <div class="info-section">
        <p-messages severity="info">
          <ng-template pTemplate>
            <div class="p-message-wrapper">
              <span class="p-message-summary">Column Visibility</span>
              <span class="p-message-detail">Move columns between the lists to show or hide them. Required columns cannot be hidden.</span>
            </div>
          </ng-template>
        </p-messages>

        <div class="column-stats">
          <span class="stat">
            <strong>Total:</strong> {{ getTotalCount() }}
          </span>
          <span class="stat">
            <strong>Visible:</strong> {{ getVisibleCount() }}
          </span>
          <span class="stat">
            <strong>Hidden:</strong> {{ getHiddenCount() }}
          </span>
        </div>
      </div>

      <!-- Transfer Component -->
      <div class="transfer-section">
        <nz-transfer
          [nzDataSource]="transferData"
          [nzTitles]="['Hidden Columns', 'Visible Columns']"
          [nzShowSearch]="true"
          [nzFilterOption]="filterOption"
          [nzShowSelectAll]="true"
          [nzRender]="renderTemplate"
          (nzChange)="onTransferChange($event)"
        >
          <!-- Custom Render Template -->
          <ng-template #renderTemplate let-item>
            <div class="transfer-item">
              <div class="item-title">{{ item.title }}</div>
              <div class="item-description" *ngIf="item.description">
                {{ item.description }}
              </div>
            </div>
          </ng-template>
        </nz-transfer>
      </div>
    </div>
  </ng-container>
</nz-drawer>

<!-- Footer Template (outside drawer, referenced by [nzFooter]) -->
<ng-template #footerTemplate>
  <div class="drawer-footer">
    <button pButton type="button" label="Cancel" (click)="onCancel()"></button>
    <button
      pButton
      type="button"
      label="Reset to Default"
      severity="danger"
      (click)="onReset()"
      [disabled]="!canReset()"
    ></button>
    <button pButton type="button" label="Apply Changes" class="p-button-primary" (click)="onApply()"></button>
  </div>
</ng-template>
