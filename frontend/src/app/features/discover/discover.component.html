<div class="workspace-container">
  <!-- Header -->
  <div class="workspace-header">
    <div>
      <h2>Vehicle Discovery</h2>
      <p class="subtitle">
        Select manufacturers and models to explore the catalog
      </p>
    </div>
    <div class="actions">
      <div *ngIf="hasActiveFilters" class="filters-summary">
        <span class="summary-label">Active Filters:</span>
        <span class="summary-count">{{ selectionCount }} model(s) selected</span>
      </div>
      <button pButton type="button" label="Clear All" (click)="onClearAll()"></button>
    </div>
  </div>

  <!-- Query Control Section -->
  <p-panel header="Query Control" [toggleable]="true">
    <app-query-control
      (filterAdd)="onFilterAdd($event)"
      (filterRemove)="onFilterRemove($event)"
      (highlightRemove)="onHighlightRemove($event)"
      (clearHighlights)="onClearHighlights()"
    >
    </app-query-control>
  </p-panel>

  <!-- Model Picker Section -->
  <p-panel header="Model Picker" [toggleable]="true" styleClass="mt-3">
    <!-- NEW: BasePickerComponent (Configuration-Driven) -->
    <div class="info-banner">
      <strong>✨ NEW: BasePickerComponent</strong>
      <span>(Configuration-driven)</span>
    </div>
    <app-base-picker
      [configId]="'manufacturer-model'"
      [externalFilters]="currentFilters"
    ></app-base-picker>

    <!-- VIN Browser (Browse ALL 1,835 VINs) -->
    <div class="info-banner vin-browser-banner">
      <strong>🚗 NEW: VIN Browser</strong>
      <span>(Browse ALL VINs with filtering: Mfr, Model, Year, Body Class, Mileage, Value)</span>
    </div>
    <app-base-picker
      [configId]="'vin-browser'"
    ></app-base-picker>
  </p-panel>

  <!-- Vehicle Results Section -->
  <p-panel header="Vehicle Results" [toggleable]="true" styleClass="mt-3">
    <app-results-table></app-results-table>
  </p-panel>

  <!-- Charts Section -->
  <p-panel header="Interactive Charts" [toggleable]="true" styleClass="mt-3">
    <app-plotly-histogram></app-plotly-histogram>
  </p-panel>
</div>
